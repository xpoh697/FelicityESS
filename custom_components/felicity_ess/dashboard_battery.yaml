# ==============================================================================
# ПАНЕЛЬ МОНИТОРИНГА АККУМУЛЯТОРА FELICITY SOLAR ESS
# ==============================================================================
# Построена на современных карточках Mushroom и Bubble Card.
#
# Требуемые HACS Frontend компоненты:
# 1. Bubble Card (https://github.com/Clooos/Bubble-Card)
# 2. Mushroom Cards (https://github.com/piitaya/lovelace-mushroom)
# 3. (Опционально) card-mod (https://github.com/thomasloven/lovelace-card-mod)
#
# ИНСТРУКЦИЯ ПО УСТАНОВКЕ В HOME ASSISTANT:
# ВАРИАНТ 1 (Рекомендуется — отдельная новая панель без риска затереть другие):
# 1. Настройки -> Панели управления -> Добавить панель управления ("Создать с нуля").
# 2. Назовите её "Батарея Felicity" и откройте её из левого бокового меню.
# 3. В правом верхнем углу (три точки ⋮) -> "Изменить панель управления" -> "Взять управление на себя".
# 4. Снова три точки (⋮) -> "Редактирование конфигурации".
# 5. Сотрите всё и вставьте этот файл ЦЕЛИКОМ -> нажмите "Сохранить".
#
# ВАРИАНТ 2 (Добавление вкладки в уже существующую панель):
# Скопируйте строки начиная со строки "  - title: Felicity Battery" и вставьте их
# в конец существующего блока "views:" вашей конфигурации (с сохранением отступа в 2 пробела).
#
# ИНСТРУКЦИЯ ПО НАСТРОЙКЕ ИМЕН СЕНСОРОВ:
# Если ваши сенсоры в Home Assistant созданы с суффиксом серийного номера
# (например, sensor.felicity_battery_100011002424520070_state_of_charge вместо sensor.felicity_battery_100011002424520070_state_of_charge),
# используйте функцию "Поиск и замена" (Ctrl+H) в вашем редакторе и замените:
# Найти:    sensor.felicity_battery_100011002424520070_
# Заменить: sensor.felicity_battery_100011002424520070_<ВАШ_СЕРИЙНЫЙ_НОМЕР>_
# ==============================================================================

title: Felicity Solar ESS
views:
  - title: Felicity Battery
    path: felicity-battery
    icon: mdi:battery-high
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # ----------------------------------------------------------------------
          # 1. Шапка и быстрый статус Bubble Card
          # ----------------------------------------------------------------------
          - type: custom:bubble-card
            card_type: separator
            name: Felicity Solar ESS
            icon: mdi:battery-charging-high
            sub_button:
              - entity: binary_sensor.felicity_battery_100011002424520070_battery_online
                show_name: false
                show_icon: true
                show_state: false
                show_background: true
              - entity: binary_sensor.felicity_battery_100011002424520070_battery_alarm
                show_name: false
                show_icon: true
                show_state: false
                show_background: true

          # ----------------------------------------------------------------------
          # 2. Горизонтальная лента чипов Mushroom Chips
          # ----------------------------------------------------------------------
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: binary_sensor.felicity_battery_100011002424520070_battery_online
                icon: >
                  {{ 'mdi:wifi-check' if is_state('binary_sensor.felicity_battery_100011002424520070_battery_online', 'on') else 'mdi:wifi-alert' }}
                icon_color: >
                  {{ 'green' if is_state('binary_sensor.felicity_battery_100011002424520070_battery_online', 'on') else 'red' }}
                content: >
                  {{ 'Онлайн' if is_state('binary_sensor.felicity_battery_100011002424520070_battery_online', 'on') else 'Офлайн' }}

              - type: template
                entity: sensor.felicity_battery_100011002424520070_state
                icon: >
                  {% set s = states('sensor.felicity_battery_100011002424520070_state') %}
                  {% if s == 'charging' %} mdi:battery-charging
                  {% elif s == 'discharging' %} mdi:battery-charging-low
                  {% else %} mdi:battery-clock
                  {% endif %}
                icon_color: >
                  {% set s = states('sensor.felicity_battery_100011002424520070_state') %}
                  {% if s == 'charging' %} green
                  {% elif s == 'discharging' %} orange
                  {% else %} blue
                  {% endif %}
                content: >
                  {% set s = states('sensor.felicity_battery_100011002424520070_state') %}
                  {% if s == 'charging' %} Зарядка
                  {% elif s == 'discharging' %} Разрядка
                  {% else %} Ожидание
                  {% endif %}

              - type: template
                entity: sensor.felicity_battery_100011002424520070_power
                icon: mdi:flash
                icon_color: >
                  {% set p = states('sensor.felicity_battery_100011002424520070_power') | float(0) %}
                  {% if p > 50 %} green
                  {% elif p < -50 %} orange
                  {% else %} grey
                  {% endif %}
                content: "{{ states('sensor.felicity_battery_100011002424520070_power') }} Вт"

              - type: template
                entity: sensor.felicity_battery_100011002424520070_max_cell_temperature
                icon: mdi:thermometer
                icon_color: >
                  {% set t = states('sensor.felicity_battery_100011002424520070_max_cell_temperature') | float(25) %}
                  {% if t > 40 %} red
                  {% elif t > 30 %} orange
                  {% else %} green
                  {% endif %}
                content: "{{ states('sensor.felicity_battery_100011002424520070_max_cell_temperature') }} °C"

              - type: template
                entity: sensor.felicity_battery_100011002424520070_cycle_count
                icon: mdi:sync
                icon_color: purple
                content: "{{ states('sensor.felicity_battery_100011002424520070_cycle_count') }} циклов"

          # ----------------------------------------------------------------------
          # 3. Главный индикатор заряда (Шкала SOC Gauge + SOH & Емкость)
          # ----------------------------------------------------------------------
          - type: gauge
            entity: sensor.felicity_battery_100011002424520070_state_of_charge
            name: Заряд батареи (SOC)
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 50

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.felicity_battery_100011002424520070_state_of_health') }}%"
                secondary: "Здоровье (SOH)"
                icon: mdi:heart-pulse
                icon_color: green
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_state_of_health

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.felicity_battery_100011002424520070_capacity') }} А·ч"
                secondary: "Ном. емкость"
                icon: mdi:battery-check
                icon_color: blue
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_capacity

          # ----------------------------------------------------------------------
          # 4. Базовые метрики пака (Напряжение, Ток, Мощность)
          # ----------------------------------------------------------------------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                layout: vertical
                primary: "{{ states('sensor.felicity_battery_100011002424520070_voltage') }} В"
                secondary: "Напряжение"
                icon: mdi:sine-wave
                icon_color: blue
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_voltage

              - type: custom:mushroom-template-card
                layout: vertical
                primary: "{{ states('sensor.felicity_battery_100011002424520070_current') }} А"
                secondary: "Ток пака"
                icon: mdi:current-dc
                icon_color: >
                  {% set c = states('sensor.felicity_battery_100011002424520070_current') | float(0) %}
                  {% if c > 0.5 %} green
                  {% elif c < -0.5 %} orange
                  {% else %} blue
                  {% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_current

              - type: custom:mushroom-template-card
                layout: vertical
                primary: "{{ states('sensor.felicity_battery_100011002424520070_power') }} Вт"
                secondary: "Мощность"
                icon: mdi:lightning-bolt
                icon_color: >
                  {% set p = states('sensor.felicity_battery_100011002424520070_power') | float(0) %}
                  {% if p > 50 %} green
                  {% elif p < -50 %} orange
                  {% else %} blue
                  {% endif %}
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_power

          # ----------------------------------------------------------------------
          # 5. Сводка балансировки ячеек (Delta V, Max, Min)
          # ----------------------------------------------------------------------
          - type: custom:bubble-card
            card_type: separator
            name: Балансировка ячеек
            icon: mdi:scale-balance

          - type: horizontal-stack
            cards:
              # Дельта напряжений (ΔV в милливольтах)
              - type: custom:mushroom-template-card
                layout: vertical
                primary: >
                  {% set max_v = states('sensor.felicity_battery_100011002424520070_max_cell_voltage') | float(0) %}
                  {% set min_v = states('sensor.felicity_battery_100011002424520070_min_cell_voltage') | float(0) %}
                  {% if max_v > 0 and min_v > 0 %}
                    {{ ((max_v - min_v) * 1000) | round(0) }} мВ
                  {% else %}
                    — мВ
                  {% endif %}
                secondary: "Разброс ΔV"
                icon: mdi:delta
                icon_color: >
                  {% set max_v = states('sensor.felicity_battery_100011002424520070_max_cell_voltage') | float(0) %}
                  {% set min_v = states('sensor.felicity_battery_100011002424520070_min_cell_voltage') | float(0) %}
                  {% set delta = (max_v - min_v) * 1000 %}
                  {% if delta <= 20 %} green
                  {% elif delta <= 40 %} amber
                  {% else %} red
                  {% endif %}
                badge_icon: >
                  {% set max_v = states('sensor.felicity_battery_100011002424520070_max_cell_voltage') | float(0) %}
                  {% set min_v = states('sensor.felicity_battery_100011002424520070_min_cell_voltage') | float(0) %}
                  {% set delta = (max_v - min_v) * 1000 %}
                  {% if delta > 40 %} mdi:alert
                  {% elif delta <= 20 %} mdi:check
                  {% endif %}
                badge_color: >
                  {% set max_v = states('sensor.felicity_battery_100011002424520070_max_cell_voltage') | float(0) %}
                  {% set min_v = states('sensor.felicity_battery_100011002424520070_min_cell_voltage') | float(0) %}
                  {% set delta = (max_v - min_v) * 1000 %}
                  {% if delta <= 20 %} green {% else %} red {% endif %}

              # Максимальная ячейка
              - type: custom:mushroom-template-card
                layout: vertical
                primary: "{{ states('sensor.felicity_battery_100011002424520070_max_cell_voltage') }} В"
                secondary: "Макс (№{{ states('sensor.felicity_battery_100011002424520070_max_cell_number') }})"
                icon: mdi:arrow-up-bold-box
                icon_color: cyan
                badge_icon: mdi:crown
                badge_color: cyan
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_max_cell_voltage

              # Минимальная ячейка
              - type: custom:mushroom-template-card
                layout: vertical
                primary: "{{ states('sensor.felicity_battery_100011002424520070_min_cell_voltage') }} В"
                secondary: "Мин (№{{ states('sensor.felicity_battery_100011002424520070_min_cell_number') }})"
                icon: mdi:arrow-down-bold-box
                icon_color: deep-orange
                badge_icon: mdi:alert-circle-outline
                badge_color: deep-orange
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_min_cell_voltage

          # ----------------------------------------------------------------------
          # 6. Матрица 16 ячеек (Grid 4x4) с подсветкой Max/Min
          # ----------------------------------------------------------------------
          - type: custom:bubble-card
            card_type: separator
            name: Напряжение ячеек (1 – 16)
            icon: mdi:grid

          - type: grid
            columns: 4
            square: false
            cards:
              # Ячейка 1
              - type: custom:mushroom-template-card
                layout: vertical
                primary: "Яч. 1"
                secondary: "{{ states('sensor.felicity_battery_100011002424520070_cell_1_voltage') }} В"
                tap_action:
                  action: more-info
                  entity: sensor.felicity_battery_100011002424520070_cell_1_voltage
                card_mod:
                  style: |
                    ha-card {
                      {% set val = states('sensor.felicity_battery_100011002424520070_cell_1_voltage') | float(0) %}
                      {% set min_v = states('sensor.felicity_battery_100011002424520070_min_cell_voltage') | float(0) %}
                      {% set max_v = states('sensor.felicity_battery_100011002424520070_max_cell_voltage') | float(0) %}
                      {% if val > 2.0 and max_v > 2.0 and (val - max_v) | abs <= 0.002 %}
                        background: rgba(0, 188, 212, 0.25) !important;
                        border: 1.5px solid #00bcd4 !important;
                      {% elif val > 2.0 and min_v > 2.0 and (val - min_v) | abs <= 0.002 %}
                        background: rgba(255, 87, 34, 0.25) !important;
                        border: 1.5px solid #ff5722 !important;
                      {% else %}
                        background: rgba(255, 255, 255, 0.04) !important;
                        border: 1px solid rgba(255, 255, 255, 0.08) !important;
                      {% endif %}
                    }

              # Ячейка 2
              - type: custom:mushroom-template-card
                layout: vertical
                primary: "Яч. 2"
                secondary: "{{ states('sensor.felicity_battery_100011002424520070_cell_2_voltage') }} В"
