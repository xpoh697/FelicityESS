        card_mod:
          style: |
            ha-card {
              {% set max_idx = states('sensor.garazh_felicity_battery_max_cell_number') | int(-1) %}
              {% set min_idx = states('sensor.garazh_felicity_battery_min_cell_number') | int(-1) %}
              {% if max_idx == 15 %}
                background: rgba(0, 188, 212, 0.25) !important;
                border: 1.5px solid #00bcd4 !important;
              {% elif min_idx == 15 %}
                background: rgba(255, 87, 34, 0.25) !important;
                border: 1.5px solid #ff5722 !important;
              {% else %}
                background: rgba(76, 175, 80, 0.18) !important;
                border: 1.5px solid rgba(76, 175, 80, 0.4) !important;
              {% endif %}
            }
